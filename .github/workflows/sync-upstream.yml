name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main

jobs:
  sync:
    if: github.repository == 'phanidileep/gitaviswa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/phanidileep/gitaviswa/merge-upstream \
            --field branch=main
